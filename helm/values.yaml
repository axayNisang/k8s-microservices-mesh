global:
  environment: production
  domain: platform.enterprise.io

authService:
  replicaCount: 3
  image:
    repository: ghcr.io/axaynisang/auth-service
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

orderService:
  replicaCount: 3
  image:
    repository: ghcr.io/axaynisang/order-service
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.platform.enterprise.io
      paths:
        - path: /auth
          pathType: Prefix
          service: auth-service
          port: 8081
        - path: /orders
          pathType: Prefix
          service: order-service
          port: 8083
